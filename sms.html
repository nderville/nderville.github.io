<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Envoi SMS – Jantes Plus</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f5f6f8; color:#1d2330; margin:0; padding:40px 16px; text-align:center; }
  .box { max-width:420px; margin:0 auto; background:#fff; border-radius:12px; padding:28px 22px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  a.btn, button { display:inline-block; margin:8px 4px 0; padding:12px 18px; border-radius:8px; border:0; font-size:15px; cursor:pointer; text-decoration:none; }
  a.btn { background:#1f6feb; color:#fff; }
  button { background:#e8eaef; color:#1d2330; }
  p { line-height:1.5; }
  .small { font-size:13px; color:#667085; }
</style>
</head>
<body>
<div class="box">
  <h2>Ouverture de l'envoi du SMS…</h2>
  <p id="msg">Si rien ne s'ouvre, cliquez sur le bouton ci-dessous.</p>
  <a class="btn" id="open" href="#">Ouvrir l'envoi du SMS</a>
  <button id="copy" type="button">Copier le lien</button>
  <p class="small">Astuce : la première fois, cochez « Toujours autoriser » quand le navigateur demande d'ouvrir l'application.</p>
</div>
<script>
  var target = "";
  try { target = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  var ok = /^(sms:|shortcuts:)/i.test(target);
  var open = document.getElementById("open");
  if (ok) {
    open.href = target;
    location.href = target;
  } else {
    document.getElementById("msg").textContent = "Lien SMS manquant ou invalide.";
    open.style.display = "none";
  }
  document.getElementById("copy").onclick = function () {
    if (!ok) return;
    navigator.clipboard.writeText(target).then(function () {
      document.getElementById("copy").textContent = "Lien copié ✓";
    });
  };
</script>
</body>
</html>
